<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英単語スタディアプリ</title>
<style>
  :root {
    --primary: #6C63FF;
    --primary-dark: #5a52d5;
    --correct: #22c55e;
    --wrong: #ef4444;
    --bg: #f0f2ff;
    --card-bg: #ffffff;
    --text: #1e1e2e;
    --subtext: #6b7280;
    --border: #e5e7eb;
    --shadow: 0 4px 20px rgba(108,99,255,0.12);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  .topnav {
    text-align: center;
    padding: 8px;
    background: white;
    font-size: 0.8rem;
    border-bottom: 1px solid var(--border);
  }
  .topnav a { color: var(--primary); text-decoration: none; font-weight: 700; }
  header {
    background: linear-gradient(135deg, var(--primary), #a78bfa);
    color: white;
    padding: 20px 16px 16px;
    text-align: center;
  }
  header h1 { font-size: 1.4rem; font-weight: 700; }
  header p { font-size: 0.8rem; opacity: 0.85; margin-top: 4px; }

  .tabs {
    display: flex;
    background: white;
    border-bottom: 2px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .tab-btn {
    flex: 1;
    padding: 14px 8px;
    border: none;
    background: transparent;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--subtext);
    cursor: pointer;
    transition: all 0.2s;
    border-bottom: 3px solid transparent;
  }
  .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }
  .tab-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .cat-tabs {
    display: flex;
    gap: 8px;
    padding: 10px 16px;
    background: white;
    border-bottom: 1px solid var(--border);
  }
  .cat-tab-btn {
    flex: 1;
    padding: 10px 8px;
    border-radius: 12px;
    border: 2px solid var(--border);
    background: white;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .cat-tab-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .speed-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 16px;
    background: white;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--subtext);
  }
  .speed-row .speed-label { flex-shrink: 0; font-weight: 600; }
  .speed-btns { display: flex; gap: 6px; flex: 1; }
  .speed-btn {
    flex: 1;
    padding: 6px 4px;
    border-radius: 10px;
    border: 2px solid var(--border);
    background: white;
    font-size: 0.75rem;
    font-weight: 700;
    color: var(--text);
    cursor: pointer;
    transition: all 0.2s;
  }
  .speed-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

  .main { padding: 16px; max-width: 600px; margin: 0 auto; }

  .empty-state {
    background: white;
    border-radius: 16px;
    padding: 40px 20px;
    text-align: center;
    box-shadow: var(--shadow);
    color: var(--subtext);
    font-size: 0.9rem;
    line-height: 1.8;
  }
  .empty-state .emoji { font-size: 2.5rem; margin-bottom: 12px; }

  .progress-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
    font-size: 0.82rem;
    color: var(--subtext);
  }
  .progress-bar { height: 6px; background: var(--border); border-radius: 3px; margin-bottom: 16px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, var(--primary), #a78bfa); border-radius: 3px; transition: width 0.4s; }

  .card-wrap {
    perspective: 1000px;
    height: 260px;
    margin-bottom: 20px;
  }
  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.5s ease;
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backface-visibility: hidden;
    box-shadow: var(--shadow);
  }
  .card-front {
    background: linear-gradient(135deg, var(--primary), #a78bfa);
    color: white;
  }
  .card-back {
    background: var(--card-bg);
    transform: rotateY(180deg);
    border: 2px solid var(--primary);
    overflow-y: auto;
  }
  .card-label {
    font-size: 0.7rem;
    font-weight: 700;
    letter-spacing: 1px;
    opacity: 0.7;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .card-front .card-label { color: rgba(255,255,255,0.8); }
  .card-back .card-label { color: var(--primary); }
  .card-word-row { display: flex; align-items: center; gap: 10px; justify-content: center; }
  .card-word { font-size: 1.6rem; font-weight: 800; text-align: center; }
  .card-meaning { font-size: 1.1rem; font-weight: 700; text-align: center; color: var(--text); margin-bottom: 14px; }

  .speak-btn {
    border: none;
    background: rgba(255,255,255,0.25);
    color: inherit;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    font-size: 1rem;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: transform 0.15s;
  }
  .speak-btn:hover { transform: scale(1.1); }
  .speak-btn:active { transform: scale(0.95); }
  .card-back .speak-btn { background: var(--bg); color: var(--primary); }
  .speak-btn.small { width: 26px; height: 26px; font-size: 0.8rem; }
  .card-example {
    background: #f5f3ff;
    border-left: 4px solid var(--primary);
    border-radius: 0 10px 10px 0;
    padding: 10px 12px;
    font-size: 0.82rem;
    line-height: 1.6;
    color: #3730a3;
    text-align: left;
    width: 100%;
  }
  .card-example .en { font-weight: 700; margin-bottom: 4px; }
  .card-hint { font-size: 0.75rem; margin-top: 12px; opacity: 0.65; }
  .card-front .card-hint { color: rgba(255,255,255,0.8); }

  .card-nav { display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 12px; }
  .nav-btn {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    font-size: 0.9rem;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .nav-btn.primary { background: var(--primary); color: white; }
  .nav-btn.primary:hover { background: var(--primary-dark); }
  .nav-btn.secondary { background: white; color: var(--primary); border: 2px solid var(--primary); }
  .nav-btn.icon { padding: 12px 16px; background: white; border: 2px solid var(--border); color: var(--text); border-radius: 12px; font-size: 1rem; }

  .quiz-q {
    background: white;
    border-radius: 16px;
    padding: 20px;
    box-shadow: var(--shadow);
    margin-bottom: 16px;
  }
  .quiz-q-text { font-size: 1.2rem; font-weight: 800; line-height: 1.6; text-align: center; }
  .choices { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .choice-btn {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
    padding: 14px 16px;
    border: 2px solid var(--border);
    border-radius: 12px;
    background: white;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    min-height: 52px;
  }
  .choice-btn:hover:not(:disabled) { border-color: var(--primary); background: #f5f3ff; }
  .choice-btn.correct { border-color: var(--correct); background: #f0fdf4; color: #166534; }
  .choice-btn.wrong { border-color: var(--wrong); background: #fef2f2; color: #991b1b; }
  .choice-label {
    width: 28px; height: 28px;
    border-radius: 50%;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center;
    font-size: 0.75rem;
    font-weight: 700;
    flex-shrink: 0;
  }
  .choice-btn.correct .choice-label { background: var(--correct); color: white; }
  .choice-btn.wrong .choice-label { background: var(--wrong); color: white; }

  .exp-box {
    background: #f5f3ff;
    border-left: 4px solid var(--primary);
    border-radius: 0 12px 12px 0;
    padding: 14px;
    font-size: 0.84rem;
    line-height: 1.6;
    margin-bottom: 14px;
    display: none;
    color: #3730a3;
  }
  .exp-box.show { display: block; }
  .exp-box .en { font-weight: 700; margin-bottom: 4px; }

  .score-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 14px;
  }
  .score-badge {
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 0.82rem;
    font-weight: 700;
  }
  .score-badge.ok { background: #f0fdf4; color: #166534; border: 2px solid var(--correct); }
  .score-badge.ng { background: #fef2f2; color: #991b1b; border: 2px solid var(--wrong); }

  .result-screen {
    background: white;
    border-radius: 20px;
    padding: 32px 20px;
    text-align: center;
    box-shadow: var(--shadow);
  }
  .result-emoji { font-size: 3rem; margin-bottom: 12px; }
  .result-score { font-size: 2.5rem; font-weight: 800; color: var(--primary); }
  .result-msg { font-size: 0.95rem; color: var(--subtext); margin: 8px 0 24px; }

  .hidden { display: none; }
</style>
</head>
<body>
<div class="topnav"><a href="index.html">← 英検3級クイズに戻る</a></div>
<header>
  <h1>📚 英単語スタディアプリ</h1>
  <p id="headerSub">毎日の単語・フレーズを、意味＆ネイティブの例文＆発音で覚えよう</p>
</header>

<div class="cat-tabs">
  <button class="cat-tab-btn active" id="catWord" onclick="switchCategory('word')">🔤 単語</button>
  <button class="cat-tab-btn" id="catPhrase" onclick="switchCategory('phrase')">💬 フレーズ</button>
</div>

<div class="tabs">
  <button class="tab-btn active" id="tabFlash" onclick="switchMode('flash')">📖 フラッシュカード</button>
  <button class="tab-btn" id="tabQuiz" onclick="switchMode('quiz')">✏️ 4択クイズ</button>
</div>

<div class="speed-row">
  <span class="speed-label">🔊 発音速度</span>
  <div class="speed-btns">
    <button class="speed-btn" data-rate="0.7" onclick="setSpeechRate(0.7)">ゆっくり</button>
    <button class="speed-btn" data-rate="1.0" onclick="setSpeechRate(1.0)">標準</button>
    <button class="speed-btn" data-rate="1.3" onclick="setSpeechRate(1.3)">はやい</button>
  </div>
</div>

<div class="main">
  <div id="emptyState" class="empty-state hidden">
    <div class="emoji">🌱</div>
    <span id="emptyStateText"></span>
  </div>

  <div id="appBody">
    <div class="progress-row">
      <span id="progressText">1 / 1</span>
      <span id="wordCountLabel">全0語</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

    <div id="flashSection">
      <div class="card-wrap" onclick="flipCard()">
        <div class="card" id="card">
          <div class="card-face card-front">
            <div class="card-label" id="cardFrontLabel">Word</div>
            <div class="card-word-row">
              <div class="card-word" id="flashWord"></div>
              <button class="speak-btn" onclick="event.stopPropagation(); speakWord()" title="発音を聞く">🔊</button>
            </div>
            <div class="card-hint">タップして答えを確認</div>
          </div>
          <div class="card-face card-back">
            <div class="card-label">Meaning</div>
            <div class="card-meaning" id="flashMeaning"></div>
            <div class="card-example">
              <div class="card-word-row" style="justify-content:flex-start">
                <div class="en" id="flashExampleEn"></div>
                <button class="speak-btn small" onclick="event.stopPropagation(); speakExample()" title="例文の発音を聞く">🔊</button>
              </div>
              <div id="flashExampleJa"></div>
            </div>
          </div>
        </div>
      </div>
      <div class="card-nav">
        <button class="nav-btn secondary" onclick="prevCard()">◀ 前へ</button>
        <button class="nav-btn icon" onclick="shuffleCards()" title="シャッフル">🔀</button>
        <button class="nav-btn primary" onclick="nextCard()">次へ ▶</button>
      </div>
    </div>

    <div id="quizSection" class="hidden">
      <div class="score-row">
        <span class="score-badge ok">✅ 正解: <span id="scoreOk">0</span></span>
        <span class="score-badge ng">❌ 不正解: <span id="scoreNg">0</span></span>
      </div>
      <div id="quizContent">
        <div class="quiz-q">
          <div class="card-word-row">
            <div class="quiz-q-text" id="quizQ"></div>
            <button class="speak-btn small" style="background:var(--bg);color:var(--primary)" onclick="speakQuiz()" title="発音を聞く">🔊</button>
          </div>
        </div>
        <div class="choices" id="choices"></div>
        <div class="exp-box" id="expBox"></div>
        <div style="text-align:center">
          <button class="nav-btn primary hidden" id="nextBtn" onclick="nextQuiz()">次の問題 ▶</button>
        </div>
      </div>
      <div class="result-screen hidden" id="resultScreen">
        <div class="result-emoji" id="resultEmoji"></div>
        <div class="result-score" id="resultScore"></div>
        <div class="result-msg" id="resultMsg"></div>
        <button class="nav-btn primary" onclick="restartQuiz()">🔄 もう一度チャレンジ</button>
      </div>
    </div>

    <div id="quizTooFew" class="empty-state hidden">
      <div class="emoji">🔢</div>
      <span id="quizTooFewText"></span>
    </div>
  </div>
</div>

<script>
// このデータは vocabulary.json / phrases.json の内容から、トリガー発動時にClaudeが
// 日本語訳・ネイティブの例文を生成して丸ごと差し替えます。
// 単語の形式: { word, meaning, exampleEn, exampleJa }
// フレーズの形式: { phrase, meaning, exampleEn, exampleJa }
const ALL_WORDS = [
  {word:"acceptance",meaning:"受け入れること、承諾",exampleEn:"The company sent a letter of acceptance to the new employee.",exampleJa:"会社は新入社員に採用通知を送った。"},
  {word:"accessory",meaning:"装身具、アクセサリー、付属品",exampleEn:"She bought a matching accessory for her outfit.",exampleJa:"彼女は服装に合うアクセサリーを買った。"},
  {word:"accomplishment",meaning:"業績、達成",exampleEn:"Graduating with honors was a great accomplishment.",exampleJa:"優等で卒業したことは大きな業績だった。"},
  {word:"account",meaning:"口座、説明・報告",exampleEn:"Please transfer the money to my account.",exampleJa:"そのお金を私の口座に振り込んでください。"},
  {word:"achievement",meaning:"業績、達成",exampleEn:"Winning the award was a remarkable achievement.",exampleJa:"受賞は素晴らしい業績だった。"},
  {word:"acquisition",meaning:"買収、獲得",exampleEn:"The acquisition of the startup doubled the company's revenue.",exampleJa:"そのスタートアップの買収により会社の収益は倍増した。"},
  {word:"admission",meaning:"入場（許可）、入学",exampleEn:"Admission to the museum is free on Sundays.",exampleJa:"日曜日は美術館の入場が無料です。"},
  {word:"advertisements",meaning:"広告",exampleEn:"The magazine is full of advertisements.",exampleJa:"その雑誌は広告でいっぱいだ。"},
  {word:"advisor",meaning:"助言者、アドバイザー",exampleEn:"She works as a financial advisor.",exampleJa:"彼女はファイナンシャルアドバイザーとして働いている。"},
  {word:"aerobics",meaning:"エアロビクス",exampleEn:"She does aerobics three times a week.",exampleJa:"彼女は週に3回エアロビクスをする。"},
  {word:"agenda",meaning:"議題、予定表",exampleEn:"The meeting agenda includes budget discussions.",exampleJa:"会議の議題には予算の話し合いが含まれる。"},
  {word:"agreement",meaning:"合意、契約",exampleEn:"Both parties signed the agreement.",exampleJa:"両者は合意書に署名した。"},
  {word:"agriculture",meaning:"農業",exampleEn:"Agriculture is the main industry in this region.",exampleJa:"この地域では農業が主要産業だ。"},
  {word:"aircraft",meaning:"航空機",exampleEn:"The aircraft landed safely despite the storm.",exampleJa:"嵐にもかかわらず航空機は無事着陸した。"},
  {word:"airline",meaning:"航空会社",exampleEn:"She works for a major airline.",exampleJa:"彼女は大手航空会社に勤めている。"},
  {word:"amenity",meaning:"設備、アメニティ",exampleEn:"The hotel offers many amenities, including a pool.",exampleJa:"そのホテルはプールを含む多くの設備を提供している。"},
  {word:"analysis",meaning:"分析",exampleEn:"The report includes a detailed analysis of sales data.",exampleJa:"その報告書には売上データの詳細な分析が含まれる。"},
  {word:"apparel",meaning:"衣料品",exampleEn:"The store specializes in outdoor apparel.",exampleJa:"その店はアウトドア衣料を専門にしている。"},
  {word:"appliance",meaning:"電化製品、器具",exampleEn:"They bought a new kitchen appliance.",exampleJa:"彼らは新しい台所用電化製品を買った。"},
  {word:"architect",meaning:"建築家",exampleEn:"The architect designed a beautiful new library.",exampleJa:"その建築家は美しい新しい図書館を設計した。"},
  {word:"array",meaning:"配列、勢揃い",exampleEn:"The store offers a wide array of products.",exampleJa:"その店は幅広い商品を取り揃えている。"},
  {word:"arrival",meaning:"到着",exampleEn:"We were notified of the flight's arrival time.",exampleJa:"私たちはフライトの到着時刻を知らされた。"},
  {word:"artwork",meaning:"芸術作品",exampleEn:"The gallery displayed contemporary artwork.",exampleJa:"そのギャラリーは現代美術作品を展示した。"},
  {word:"aspect",meaning:"側面、様相",exampleEn:"Consider every aspect of the proposal before deciding.",exampleJa:"決定する前に提案のあらゆる側面を検討してください。"},
  {word:"assignment",meaning:"課題、任務",exampleEn:"She completed the assignment ahead of schedule.",exampleJa:"彼女は予定より早く課題を終えた。"},
  {word:"assistant",meaning:"助手、アシスタント",exampleEn:"He hired a personal assistant.",exampleJa:"彼は個人アシスタントを雇った。"},
  {word:"associate",meaning:"仲間、同僚（動詞では関連付ける）",exampleEn:"He is a research associate at the university.",exampleJa:"彼はその大学の研究員だ。"},
  {word:"atmosphere",meaning:"雰囲気、大気",exampleEn:"The restaurant has a cozy atmosphere.",exampleJa:"そのレストランは居心地の良い雰囲気だ。"},
  {word:"auction",meaning:"競売、オークション",exampleEn:"The painting sold for millions at the auction.",exampleJa:"その絵はオークションで数百万で売れた。"},
  {word:"auditorium",meaning:"講堂、公会堂",exampleEn:"The concert was held in the school auditorium.",exampleJa:"コンサートは学校の講堂で開催された。"},
  {word:"author",meaning:"著者、作家",exampleEn:"The author signed copies of her new book.",exampleJa:"その著者は新著にサインをした。"},
  {word:"automobile",meaning:"自動車",exampleEn:"The automobile industry is changing rapidly.",exampleJa:"自動車業界は急速に変化している。"},
  {word:"avenue",meaning:"大通り、手段",exampleEn:"The office is located on Fifth Avenue.",exampleJa:"オフィスは5番街にある。"},
  {word:"backpack",meaning:"リュックサック",exampleEn:"He packed his backpack for the trip.",exampleJa:"彼は旅行のためにリュックに荷物を詰めた。"},
  {word:"badge",meaning:"名札、バッジ",exampleEn:"Employees must wear an ID badge at all times.",exampleJa:"従業員は常にIDバッジを着用しなければならない。"},
  {word:"baggage",meaning:"手荷物",exampleEn:"Please check your baggage at the counter.",exampleJa:"カウンターで手荷物を預けてください。"},
  {word:"ballroom",meaning:"舞踏室、宴会場",exampleEn:"The wedding reception was held in the ballroom.",exampleJa:"結婚披露宴は宴会場で開催された。"},
  {word:"banquet",meaning:"宴会",exampleEn:"The company held a banquet to celebrate its anniversary.",exampleJa:"会社は記念日を祝うために宴会を開いた。"},
  {word:"basis",meaning:"基礎、根拠",exampleEn:"The decision was made on the basis of the survey results.",exampleJa:"その決定は調査結果に基づいて行われた。"},
  {word:"belonging",meaning:"（複数形で）所持品、所属意識",exampleEn:"She packed all her belongings before moving.",exampleJa:"彼女は引っ越す前に全ての持ち物を詰めた。"},
  {word:"beverage",meaning:"飲み物",exampleEn:"The menu offers a variety of beverages.",exampleJa:"メニューには様々な飲み物がある。"},
  {word:"bid",meaning:"入札（する）",exampleEn:"The company submitted a bid for the contract.",exampleJa:"その会社は契約のために入札した。"},
  {word:"billion",meaning:"10億",exampleEn:"The company's revenue exceeded one billion dollars.",exampleJa:"その会社の収益は10億ドルを超えた。"},
  {word:"biography",meaning:"伝記",exampleEn:"She wrote a biography of a famous scientist.",exampleJa:"彼女は有名な科学者の伝記を書いた。"},
  {word:"bistro",meaning:"ビストロ（小さなレストラン）",exampleEn:"We had dinner at a cozy bistro downtown.",exampleJa:"私たちは街中の居心地の良いビストロで夕食をとった。"},

const CATEGORY_INFO = {
  word:   { items: ALL_WORDS,   key: 'word',   label: '単語',     unit: '語',     cardLabel: 'Word' },
  phrase: { items: ALL_PHRASES, key: 'phrase', label: 'フレーズ', unit: 'フレーズ', cardLabel: 'Phrase' },
};

let category = 'word';
let mode = 'flash';
let flashIdx = 0;
let quizList = [];
let quizIdx = 0;
let scoreOk = 0;
let scoreNg = 0;
let answered = false;

const LABELS = ['A','B','C','D'];

function currentInfo() { return CATEGORY_INFO[category]; }
function currentItems() { return currentInfo().items; }
function termOf(item) { return item[currentInfo().key]; }

let speechRate = 1.0;
try {
  const saved = localStorage.getItem('vocabSpeechRate');
  if (saved) speechRate = parseFloat(saved);
} catch (e) {}

function setSpeechRate(rate) {
  speechRate = rate;
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.rate) === rate);
  });
  try { localStorage.setItem('vocabSpeechRate', String(rate)); } catch (e) {}
}

function speak(text) {
  if (!text || !('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'en-US';
  utter.rate = speechRate;
  window.speechSynthesis.speak(utter);
}

function speakWord() { speak(termOf(currentItems()[flashIdx])); }
function speakExample() { speak(currentItems()[flashIdx]?.exampleEn); }
function speakQuiz() { speak(termOf(quizList[quizIdx])); }

function switchCategory(cat) {
  category = cat;
  document.getElementById('catWord').classList.toggle('active', cat === 'word');
  document.getElementById('catPhrase').classList.toggle('active', cat === 'phrase');
  document.getElementById('cardFrontLabel').textContent = currentInfo().cardLabel;
  flashIdx = 0;
  document.getElementById('card').classList.remove('flipped');
  init();
}

function initSpeedButtons() {
  document.querySelectorAll('.speed-btn').forEach(b => {
    b.classList.toggle('active', parseFloat(b.dataset.rate) === speechRate);
  });
}

function init() {
  initSpeedButtons();
  const info = currentInfo();
  const items = currentItems();
  document.getElementById('cardFrontLabel').textContent = info.cardLabel;
  document.getElementById('wordCountLabel').textContent = `全${items.length}${info.unit}`;
  if (items.length === 0) {
    document.getElementById('emptyStateText').innerHTML =
      `まだ${info.label}が登録されていません。<br>` +
      `毎日の${info.label}をチャットで伝えると、ここに貯まっていきます。<br>` +
      `ある程度貯まったら「単語帳アプリ更新して」と言ってね。`;
    document.getElementById('emptyState').classList.remove('hidden');
    document.getElementById('appBody').classList.add('hidden');
    return;
  }
  document.getElementById('emptyState').classList.add('hidden');
  document.getElementById('appBody').classList.remove('hidden');
  document.getElementById('tabQuiz').disabled = items.length < 4;
  if (mode === 'flash') showFlash();
  else startQuiz();
}

function switchMode(m) {
  if (m === 'quiz' && currentItems().length < 4) return;
  mode = m;
  document.getElementById('tabFlash').classList.toggle('active', m === 'flash');
  document.getElementById('tabQuiz').classList.toggle('active', m === 'quiz');
  document.getElementById('flashSection').classList.toggle('hidden', m !== 'flash');
  document.getElementById('quizSection').classList.toggle('hidden', m !== 'quiz');
  document.getElementById('quizTooFew').classList.add('hidden');
  if (m === 'flash') { document.getElementById('card').classList.remove('flipped'); showFlash(); }
  else startQuiz();
}

function showFlash() {
  const items = currentItems();
  const w = items[flashIdx];
  document.getElementById('flashWord').textContent = termOf(w);
  document.getElementById('flashMeaning').textContent = w.meaning;
  document.getElementById('flashExampleEn').textContent = w.exampleEn;
  document.getElementById('flashExampleJa').textContent = w.exampleJa;
  document.getElementById('card').classList.remove('flipped');
  updateProgress(flashIdx + 1, items.length);
}

function flipCard() { document.getElementById('card').classList.toggle('flipped'); }

function nextCard() {
  const items = currentItems();
  flashIdx = (flashIdx + 1) % items.length;
  showFlash();
}

function prevCard() {
  const items = currentItems();
  flashIdx = (flashIdx - 1 + items.length) % items.length;
  showFlash();
}

function shuffleCards() {
  const items = currentItems();
  for (let i = items.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [items[i], items[j]] = [items[j], items[i]];
  }
  flashIdx = 0;
  showFlash();
}

function startQuiz() {
  const items = currentItems();
  if (items.length < 4) {
    document.getElementById('quizContent').classList.add('hidden');
    document.getElementById('resultScreen').classList.add('hidden');
    document.getElementById('quizTooFewText').textContent =
      `4択クイズは${currentInfo().label}が4つ以上たまると使えるようになります。フラッシュカードで覚えよう！`;
    document.getElementById('quizTooFew').classList.remove('hidden');
    return;
  }
  document.getElementById('quizTooFew').classList.add('hidden');
  document.getElementById('quizContent').classList.remove('hidden');
  quizList = [...items];
  for (let i = quizList.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [quizList[i], quizList[j]] = [quizList[j], quizList[i]];
  }
  quizIdx = 0;
  scoreOk = 0; scoreNg = 0;
  updateScore();
  document.getElementById('resultScreen').classList.add('hidden');
  showQuiz();
}

function showQuiz() {
  if (quizIdx >= quizList.length) { showResult(); return; }
  const w = quizList[quizIdx];
  answered = false;
  document.getElementById('quizQ').textContent = termOf(w);
  document.getElementById('expBox').className = 'exp-box';
  document.getElementById('nextBtn').classList.add('hidden');

  const distractors = currentItems().filter(o => termOf(o) !== termOf(w))
    .sort(() => Math.random() - 0.5)
    .slice(0, 3)
    .map(o => o.meaning);
  const choicesArr = [w.meaning, ...distractors];
  const shuffled = choicesArr.map((text, i) => ({ text, isCorrect: i === 0 }));
  for (let i = shuffled.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }

  const cont = document.getElementById('choices');
  cont.innerHTML = '';
  shuffled.forEach((ch, idx) => {
    const btn = document.createElement('button');
    btn.className = 'choice-btn';
    btn.innerHTML = `<span class="choice-label">${LABELS[idx]}</span>${ch.text}`;
    btn.onclick = () => {
      if (answered) return;
      answered = true;
      if (ch.isCorrect) { scoreOk++; btn.classList.add('correct'); }
      else {
        scoreNg++;
        btn.classList.add('wrong');
        cont.querySelectorAll('.choice-btn').forEach((b, bi) => {
          if (shuffled[bi].isCorrect) b.classList.add('correct');
        });
      }
      cont.querySelectorAll('.choice-btn').forEach(b => b.disabled = true);
      document.getElementById('expBox').innerHTML =
        `<div class="en">${w.exampleEn}</div><div>${w.exampleJa}</div>`;
      document.getElementById('expBox').classList.add('show');
      document.getElementById('nextBtn').classList.remove('hidden');
      updateScore();
    };
    cont.appendChild(btn);
  });

  updateProgress(quizIdx + 1, quizList.length);
}

function nextQuiz() {
  quizIdx++;
  showQuiz();
}

function updateScore() {
  document.getElementById('scoreOk').textContent = scoreOk;
  document.getElementById('scoreNg').textContent = scoreNg;
}

function updateProgress(cur, total) {
  document.getElementById('progressText').textContent = `${cur} / ${total}`;
  document.getElementById('wordCountLabel').textContent = `全${currentItems().length}${currentInfo().unit}`;
  document.getElementById('progressFill').style.width = `${(cur / total) * 100}%`;
}

function showResult() {
  document.getElementById('quizContent').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  const pct = Math.round((scoreOk / quizList.length) * 100);
  document.getElementById('resultScore').textContent = `${pct}%`;
  const msgs = [
    [80, '🎉', '素晴らしい！しっかり覚えられています！'],
    [60, '😊', 'もう少し！苦手なところを重点的に復習しよう'],
    [0,  '💪', 'もっと頑張れる！繰り返し練習しよう！'],
  ];
  const [,emoji, msg] = msgs.find(([t]) => pct >= t);
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultMsg').textContent = `${scoreOk}問正解 / ${quizList.length}問中　${msg}`;
}

function restartQuiz() { startQuiz(); }

init();
</script>
</body>
</html>
